name: One-shot final manifest freeze after Foundation QA fix

on:
  push:
    branches:
      - feature/gtm-autopilot-v1
    paths:
      - .github/workflows/manifest-finalizer-foundation-qa.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/gtm-autopilot-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Remove one-shot workflow before generation
        run: git rm .github/workflows/manifest-finalizer-foundation-qa.yml

      - name: Regenerate manifests from settled tree
        run: node scripts/regen-manifests.mjs

      - name: Commit final generated manifests
        shell: bash
        run: |
          git config user.name "miketui"
          git config user.email "208109316+miketui@users.noreply.github.com"
          git add docs/FILE-TREE.md docs/FILE-INVENTORY.md
          git commit -m "chore(gtm): freeze manifests after Foundation QA fix"
          git push origin HEAD:feature/gtm-autopilot-v1
