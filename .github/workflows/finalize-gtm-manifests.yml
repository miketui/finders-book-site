name: Finalize GTM manifests once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Stage this one-shot workflow for deletion before inventory generation
        run: git rm .github/workflows/finalize-gtm-manifests.yml

      - name: Regenerate repository manifests from final tracked tree
        run: node scripts/regen-manifests.mjs

      - name: Commit final generated manifests and self-delete
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "finders-book-manifest-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add docs/FILE-TREE.md docs/FILE-INVENTORY.md
          git commit -m "chore: finalize repository manifests"
          git push origin "HEAD:$PR_HEAD_REF"
