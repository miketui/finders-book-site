name: GTM Autopilot final hardening

on:
  pull_request:
    branches: [main]
    paths:
      - "gtm/**"
      - ".github/workflows/gtm-autopilot.yml"
      - ".github/workflows/gtm-final-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    name: GTM final hardening validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify locked Autopilot dependencies
        run: uv sync --project gtm/autopilot --locked

      - name: Verify repository secret scan after Python environment setup
        run: node scripts/check-secrets.mjs

      - name: Compile hardened runtime
        run: python -m py_compile gtm/autopilot/main.py gtm/autopilot/model_provider.py gtm/autopilot/gemini_fallback_selftest.py gtm/autopilot/control_plane.py gtm/autopilot/network_guard.py gtm/autopilot/final_hardening.py gtm/autopilot/render_contracts.py gtm/ebook/build_epub.py

      - name: Exercise opt-in Gemini fallback guardrails
        run: PYTHONPATH=gtm/autopilot uv run --project gtm/autopilot python gtm/autopilot/gemini_fallback_selftest.py

      - name: Validate final architecture contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          day_plan = json.loads(Path('gtm/day-plan.json').read_text())
          assert len(day_plan['days']) == 30
          for day in day_plan['days']:
              outputs = day.get('outputs', [])
              assert outputs, f"Day {day['day']} missing durable outputs"
              assert all(path.startswith('reports/day-') for path in outputs)

          hardening = Path('gtm/autopilot/final_hardening.py').read_text()
          render_contracts = Path('gtm/autopilot/render_contracts.py').read_text()
          network = Path('gtm/autopilot/network_guard.py').read_text()
          provider = Path('gtm/autopilot/model_provider.py').read_text()
          main_runtime = Path('gtm/autopilot/main.py').read_text()
          workflow = Path('.github/workflows/gtm-autopilot.yml').read_text()
          epub = Path('gtm/ebook/build_epub.py').read_text()

          for category in (
              'video_reference_still', 'carousel_master', 'pinterest_pin', 'video'
          ):
              assert category in hardening
          assert 'Day 6 requires exactly' in hardening
          assert 'current-run reference image' in hardening
          assert 'Rejected out-of-contract artifact paths' in hardening
          assert 'pending_approval_index' in hardening
          assert 'max_spend_usd' not in hardening[hardening.index('def public_status_payload'):]
          assert 'GTM_EBOOK_SOURCE_URL' in hardening
          assert 'GTM_EBOOK_SOURCE_SHA256' in hardening
          assert 'sha256_verified' in hardening

          assert 'normalized_output_name' in render_contracts
          assert 'distinct normalized output filenames' in render_contracts
          assert 'must use a .png filename' in render_contracts
          assert 'must use a .mp4 filename' in render_contracts
          assert 'resume-ledger.json' in render_contracts
          assert 'PROVIDER_FAILED_AMBIGUOUS' in render_contracts
          assert 'automatic rerendering is blocked to prevent duplicate spend' in render_contracts
          assert 'unit.get("kind") == "foundation_qa"' in render_contracts

          assert 'class PinnedHTTPSConnection' in network
          assert 'server_hostname=self.host' in network
          assert 'self._validated_ip' in network
          assert 'urllib.request' not in network
          assert 'MAX_DOWNLOAD_BYTES' in network

          assert 'Resolve browser for Autopilot QA' in workflow
          assert 'final_hardening.main()' in workflow
          assert 'render_contracts' in workflow
          assert 'ebook-ingest' in workflow
          assert 'GTM_EBOOK_SOURCE_URL' in workflow
          assert '--exclude=\'ebook/*.epub\'' not in workflow
          assert '${{ env.GTM_RUNTIME_ROOT }}/ebook/*.epub' not in workflow
          assert 'Upload generated creative artifacts' in workflow
          assert "'foundation', 'reports', 'ebook', 'creative'" in workflow
          assert 'foundation reports ebook creative' in workflow
          assert 'AUTOPILOT_BOOTSTRAP' in workflow
          assert 'starting from checked-in PHASE0 templates' in workflow
          assert 'GTM_MODEL_PROVIDER' in workflow
          assert 'GEMINI_API_KEY is required when GTM_MODEL_PROVIDER=gemini.' in workflow
          job_env = workflow[workflow.index('    env:'):workflow.index('    steps:')]
          assert 'OPENAI_API_KEY:' not in job_env
          assert 'GEMINI_API_KEY:' not in job_env
          assert workflow.index('Restore encrypted GTM runtime state') < workflow.index('Validate selected text-provider credential')
          assert 'GTM_REQUIRES_OPENAI_IMAGE' in workflow
          assert 'class _NoRedirectHandler' in provider
          assert 'x-goog-api-key' in provider
          assert 'google_search' in provider
          assert 'trace_provider.set_disabled(True)' in provider
          assert 'set_trace_provider(trace_provider)' in provider
          assert 'ModelSettings(max_tokens=24_000)' in main_runtime
          assert 'AfterValidator(_bounded_text(40_000))' in main_runtime
          assert 'AfterValidator(_bounded_artifacts)' in main_runtime
          assert '> 55_000' in main_runtime

          assert 'def modified_timestamp' in epub
          assert 'datetime.now(timezone.utc)' in epub
          assert 'if not re.match(r"^[A-Za-z_]", cleaned)' in epub
          assert 'metadata.identifier is required and must remain stable across rebuilds' in epub
          assert 'RESERVED_PACKAGE_IDS' in epub
          assert 'RESERVED_OUTPUT_BASENAMES' in epub
          assert Path('gtm/ebook/PRIVATE-INGESTION.md').exists()

          print('PASS: final GTM autonomy, resume safety, Foundation QA, privacy, Day 6, filename, network and EPUB contracts validated.')
          PY

      - name: Exercise hardened active-unit, Foundation QA, status and render schemas
        shell: bash
        run: |
          PYTHONPATH=gtm/autopilot uv run --project gtm/autopilot python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          os.environ['GTM_RUNTIME_ROOT'] = tempfile.mkdtemp(prefix='gtm-hardening-')
          import final_hardening as fh
          import render_contracts as rc

          fh.engine.CreativeJob = fh.HardenedCreativeJob
          fh.engine.RunOutput = fh.HardenedRunOutput

          unit = fh.hardened_active_unit({
              'mode': 'THIRTY_DAY', 'current_day': 6, 'status': 'READY'
          })
          assert unit['required_outputs'] == ['reports/day-06-deliverable.md']

          categories = {
              'video_reference_still', 'carousel_master', 'pinterest_pin', 'video'
          }
          assert set(fh.CreativeCategory.__args__) == categories

          image = fh.HardenedCreativeJob(
              asset_id='img-1', kind='image', category='pinterest_pin',
              prompt='test', filename='pin.png', size_or_ratio='1024x1536'
          )
          video = fh.HardenedCreativeJob(
              asset_id='vid-1', kind='video', category='video',
              prompt='test', filename='video.mp4', size_or_ratio='720:1280',
              reference_image='img-1'
          )
          assert rc.normalized_output_name(image) == 'pin.png'
          assert rc.normalized_output_name(video) == 'video.mp4'

          fh.engine.RUNTIME_ROOT.mkdir(parents=True, exist_ok=True)
          persisted = fh.engine.RUNTIME_ROOT / 'foundation' / 'persisted-section.md'
          persisted.parent.mkdir(parents=True, exist_ok=True)
          persisted.write_text('persisted from a prior section run')
          rc._CURRENT_WRITTEN_PATHS.clear()
          qa_ok, qa_missing = rc.current_run_required_outputs_exist({
              'kind': 'foundation_qa',
              'required_outputs': ['foundation/persisted-section.md'],
          })
          assert qa_ok and not qa_missing
          day_ok, day_missing = rc.current_run_required_outputs_exist({
              'kind': 'day',
              'required_outputs': ['foundation/persisted-section.md'],
          })
          assert not day_ok
          assert day_missing == ['foundation/persisted-section.md']

          (fh.engine.RUNTIME_ROOT / 'approvals.json').write_text(
              '{"pending":[{"id":"abc","approval_class":"RED","blocking":true,"status":"PENDING","reason":"private","max_spend_usd":999}],"resolved":[]}'
          )
          (fh.engine.RUNTIME_ROOT / 'state.json').write_text(
              '{"mode":"PHASE0","foundation_cursor":0,"completed_foundation_sections":[],"foundation_qa_passed":false,"current_day":1,"status":"AWAITING_APPROVAL","blocking_approval_ids":["abc"]}'
          )
          payload = fh.public_status_payload()
          item = payload['pending_approval_index'][0]
          assert set(item) == {'id', 'approval_class', 'blocking', 'status'}
          assert 'reason' not in item and 'max_spend_usd' not in item
          print('PASS: Foundation QA accepts persisted section outputs while daily units still require current-run writes.')
          PY

      - name: Exercise Day 6 paid-render resume without duplicate spend
        shell: bash
        run: |
          PYTHONPATH=gtm/autopilot uv run --project gtm/autopilot python - <<'PY'
          import os
          import tempfile

          os.environ['GTM_RUNTIME_ROOT'] = tempfile.mkdtemp(prefix='gtm-resume-')
          os.environ['OPENAI_API_KEY'] = 'test-openai-key'
          os.environ['RUNWAYML_API_SECRET'] = 'test-runway-key'

          import final_hardening as fh
          import render_contracts as rc

          fh.engine.CreativeJob = fh.HardenedCreativeJob
          fh.engine.RunOutput = fh.HardenedRunOutput

          unit = fh.hardened_active_unit({
              'mode': 'THIRTY_DAY', 'current_day': 6, 'status': 'READY'
          })
          unit['rendering_enabled'] = True

          jobs = []
          refs = []
          for i in range(1, 6):
              asset_id = f'ref-{i}'
              refs.append(asset_id)
              jobs.append(fh.HardenedCreativeJob(
                  asset_id=asset_id,
                  kind='image',
                  category='video_reference_still',
                  prompt=f'reference {i}',
                  filename=f'reference-{i}.png',
                  size_or_ratio='1024x1536',
              ))
          for i in range(1, 6):
              jobs.append(fh.HardenedCreativeJob(
                  asset_id=f'carousel-{i}',
                  kind='image',
                  category='carousel_master',
                  prompt=f'carousel {i}',
                  filename=f'carousel-{i}.png',
                  size_or_ratio='1024x1536',
              ))
          for i in range(1, 6):
              jobs.append(fh.HardenedCreativeJob(
                  asset_id=f'pin-{i}',
                  kind='image',
                  category='pinterest_pin',
                  prompt=f'pin {i}',
                  filename=f'pin-{i}.png',
                  size_or_ratio='1024x1536',
              ))
          for i in range(1, 6):
              jobs.append(fh.HardenedCreativeJob(
                  asset_id=f'video-{i}',
                  kind='video',
                  category='video',
                  prompt=f'video {i}',
                  filename=f'video-{i}.mp4',
                  size_or_ratio='720:1280',
                  duration_seconds=5,
                  reference_image=refs[i - 1],
              ))

          output = fh.HardenedRunOutput(
              run_status='PASS',
              executive_summary='test',
              pass_condition_met=True,
              next_action='test',
              founder_brief='test',
              creative_jobs=jobs,
          )

          ledger, ledger_path, violations = rc._ensure_day6_resume_ledger(output, unit)
          assert not violations
          missing_id = 'pin-5'
          for job in jobs:
              if job.asset_id == missing_id:
                  continue
              path = rc._resume_asset_path(unit, job)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(f'cached-{job.asset_id}'.encode())
              rc._record_resume_status(
                  ledger, ledger_path, job, status='RENDERED', path=path
              )

          calls = []
          def fake_provider(one, active_unit, run_id):
              job = one.creative_jobs[0]
              calls.append(job.asset_id)
              target = (
                  fh.engine.RUNTIME_ROOT
                  / 'creative'
                  / active_unit['id']
                  / run_id
                  / rc.normalized_output_name(job)
              )
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(b'new-paid-output')
              return {
                  'rendered': [{
                      'asset_id': job.asset_id,
                      'status': 'RENDERED',
                      'path': str(target.relative_to(fh.engine.RUNTIME_ROOT)),
                  }]
              }

          fh.control_plane._original_render_creative_jobs = fake_provider
          result = rc.strict_render_creative_jobs(output, unit, 'resume-regression')
          assert not result.get('violations'), result
          assert calls == [missing_id], calls
          assert len(result['rendered']) == 20
          assert sum(bool(item.get('reused')) for item in result['rendered']) == 19

          ledger = __import__('json').loads(ledger_path.read_text())
          missing_job = next(job for job in jobs if job.asset_id == missing_id)
          rc._record_resume_status(
              ledger,
              ledger_path,
              missing_job,
              status='PROVIDER_FAILED_AMBIGUOUS',
              detail='simulated ambiguous provider outcome',
          )
          calls.clear()
          blocked = rc.strict_render_creative_jobs(output, unit, 'ambiguous-regression')
          assert blocked.get('violations')
          assert calls == []
          assert 'duplicate spend' in ' '.join(blocked['violations'])
          print('PASS: Day 6 reuses 19 completed paid jobs, calls only the missing job, and blocks ambiguous retries.')
          PY

      - name: Exercise EPUB validity, stable identity and reserved package IDs
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/valid.json" <<'JSON'
          {
            "metadata": {
              "title": "Finder Test Reading Edition",
              "creator": "Test",
              "language": "en-US",
              "identifier": "urn:uuid:11111111-2222-3333-4444-555555555555",
              "modified": "2026-08-20T13:00:00Z"
            },
            "chapters": [{"id":"1-introduction","title":"One","body_xhtml":"<p>A &amp; B</p>"}]
          }
          JSON
          python gtm/ebook/build_epub.py --input "$tmpdir/valid.json" --output "$tmpdir/valid.epub"
          test -s "$tmpdir/valid.epub"
          python - "$tmpdir/valid.epub" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              opf = zf.read('OEBPS/content.opf').decode()
          assert 'id="id-1-introduction"' in opf
          assert '2026-08-20T13:00:00Z' in opf
          print('PASS: EPUB uses stable revision metadata and OPF-safe IDs.')
          PY

          cat > "$tmpdir/reserved.json" <<'JSON'
          {
            "metadata": {
              "identifier": "urn:uuid:aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee",
              "modified": "2026-08-20T13:00:00Z"
            },
            "chapters": [
              {"id":"nav","title":"Nav collision","body_xhtml":"<p>One</p>"},
              {"id":"css","title":"CSS collision","body_xhtml":"<p>Two</p>"},
              {"id":"book-id","title":"Book ID collision","body_xhtml":"<p>Three</p>"},
              {"id":"styles","title":"Styles collision","body_xhtml":"<p>Four</p>"}
            ]
          }
          JSON
          python gtm/ebook/build_epub.py --input "$tmpdir/reserved.json" --output "$tmpdir/reserved.epub"
          python - "$tmpdir/reserved.epub" <<'PY'
          import re
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = zf.namelist()
              opf = zf.read('OEBPS/content.opf').decode()

          assert names.count('OEBPS/nav.xhtml') == 1
          assert names.count('OEBPS/styles.css') == 1
          ids = re.findall(r'\bid="([^"]+)"', opf)
          assert len(ids) == len(set(ids)), ids
          assert ids.count('nav') == 1
          assert ids.count('css') == 1
          assert ids.count('book-id') == 1
          assert any(name.startswith('OEBPS/nav-chapter-') for name in names)
          assert any(name.startswith('OEBPS/styles-chapter-') for name in names)
          print('PASS: reserved OPF IDs and generated filenames cannot be overwritten by chapter IDs.')
          PY

          cat > "$tmpdir/malformed.json" <<'JSON'
          {
            "metadata": {"identifier":"urn:uuid:11111111-2222-3333-4444-555555555555"},
            "chapters": [{"id":"one","title":"One","body_xhtml":"<p>A & B</p>"}]
          }
          JSON
          if python gtm/ebook/build_epub.py --input "$tmpdir/malformed.json" --output "$tmpdir/bad.epub"; then
            echo "Malformed XHTML unexpectedly passed."
            exit 1
          fi

      - name: Verify repository diff formatting
        run: git diff --check
