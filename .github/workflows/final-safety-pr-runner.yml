name: One-shot final GTM safety PR runner

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/final-safety-patch.py
      - .github/workflows/final-safety-pr-runner.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/gtm-autopilot-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply verified safety fixes
        run: python scripts/final-safety-patch.py

      - name: Commit code-only safety fixes
        shell: bash
        run: |
          git config user.name "miketui"
          git config user.email "208109316+miketui@users.noreply.github.com"
          git add gtm/autopilot/final_hardening.py gtm/autopilot/network_guard.py
          git commit -m "fix(gtm): close final autonomy safety gaps"
          git push origin HEAD:feature/gtm-autopilot-v1
