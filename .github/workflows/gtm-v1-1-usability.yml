name: Finder's Book GTM v1.1 Usability Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gtm-autopilot.yml"
      - ".github/workflows/gtm-foundation-export.yml"
      - ".github/workflows/gtm-v1-1-usability.yml"
      - ".github/workflows/gtm-v1-1-python-finalizer.yml"
      - "gtm/**"
      - "docs/FILE-TREE.md"
      - "docs/FILE-INVENTORY.md"

permissions:
  contents: write

jobs:
  validate-v1-1-usability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply staged Python hardening once
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          ruby -ryaml -e 'wf=YAML.load_file(".github/workflows/gtm-v1-1-python-finalizer.yml", aliases: true); step=wf.fetch("jobs").fetch("patch").fetch("steps").find{|item| item["name"] == "Apply reviewed Python hardening"}; abort("missing finalizer step") unless step; File.write("/tmp/gtm-v1-1-apply.sh", step.fetch("run"))'
          bash /tmp/gtm-v1-1-apply.sh
          git config user.name "finders-book-v1-1-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add gtm/autopilot/main.py gtm/autopilot/v1_1.py gtm/autopilot/v1_1_selftest.py gtm/autopilot/state_crypto.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(gtm): harden v1.1 operator and fidelity runtime"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "Staged Python hardening is already applied."
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked Autopilot dependencies
        run: uv sync --project gtm/autopilot --locked

      - name: Compile v1.1 runtime
        run: python -m py_compile gtm/autopilot/main.py gtm/autopilot/v1_1.py gtm/autopilot/v1_1_selftest.py gtm/autopilot/state_crypto.py

      - name: Run v1.1 usability self-test
        run: |
          uv run --project gtm/autopilot python -c \
            'import sys; sys.path.insert(0, "gtm/autopilot"); import v1_1_selftest; v1_1_selftest.main()'

      - name: Verify 42-prompt inventory
        shell: bash
        run: |
          section_count="$(grep -c '^## SECTION: [0-9][0-9]*$' gtm/prompts/sections.md)"
          day_count="$(grep -c '^## DAY: [0-9][0-9]*$' gtm/prompts/days.md)"
          test "$section_count" -eq 12
          test "$day_count" -eq 30
          echo "42 AGM prompt bodies present: 12 Section + 30 Daily."

      - name: Generate exact repository manifest candidates
        run: node scripts/regen-manifests.mjs

      - name: Upload manifest candidates
        uses: actions/upload-artifact@v4
        with:
          name: gtm-v1-1-manifest-candidates-${{ github.run_id }}
          path: |
            docs/FILE-TREE.md
            docs/FILE-INVENTORY.md
          if-no-files-found: error
          retention-days: 1
