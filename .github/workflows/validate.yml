name: Validate Finder's Book site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project metadata
        run: npm ci --ignore-scripts

      - name: Run repository validation
        run: npm run validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  render:
    name: Rendered-page smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve browser for Playwright
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -n "$chrome_path" ]]; then
            echo "PLAYWRIGHT_CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
            "$chrome_path" --version
          else
            echo "No system Chrome found; installing Playwright Chromium."
            npx playwright install --with-deps chromium
          fi

      - name: Render smoke test
        run: npm run test:render

  gtm-autopilot:
    name: GTM Autopilot static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify locked dependencies
        run: uv sync --project gtm/autopilot --locked

      - name: Compile Autopilot, control plane and EPUB builder
        run: python -m py_compile gtm/autopilot/main.py gtm/autopilot/control_plane.py gtm/ebook/build_epub.py

      - name: Validate GTM architecture and control-plane contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('gtm')
          phase0 = json.loads((root / 'phase0-plan.json').read_text())
          day_plan = json.loads((root / 'day-plan.json').read_text())
          state = json.loads((root / 'state.json').read_text())
          budget = json.loads((root / 'creative-budget.json').read_text())
          agents_text = (root / 'prompts' / 'agents.md').read_text()
          sections_text = (root / 'prompts' / 'sections.md').read_text()
          control_text = (root / 'autopilot' / 'control_plane.py').read_text()
          epub_text = (root / 'ebook' / 'build_epub.py').read_text()
          workflow_text = Path('.github/workflows/gtm-autopilot.yml').read_text()

          expected_order = [12, 1, 2, 3, 4, 6, 7, 8, 9, 10, 11, 5]
          actual_order = phase0['execution_order']
          assert actual_order == expected_order, (actual_order, expected_order)
          assert sorted(actual_order) == list(range(1, 13))
          assert len(phase0['sections']) == 12

          section_headers = re.findall(r'^## SECTION: (\d+)\s*$', sections_text, flags=re.M)
          assert sorted(map(int, section_headers)) == list(range(1, 13)), section_headers

          agent_headers = re.findall(r'^## AGENT: ([A-Z_]+)\s*$', agents_text, flags=re.M)
          expected_agents = {
              'SEO', 'CONTENT', 'GROWTH', 'COMMERCE', 'ANALYTICS',
              'PARTNERSHIPS', 'RELEASE_QA', 'CREATIVE_PRODUCTION', 'EBOOK_PRODUCTION'
          }
          assert set(agent_headers) == expected_agents, agent_headers
          assert len(agent_headers) == 9

          assert state['mode'] == 'PHASE0'
          assert state['foundation_cursor'] == 0
          assert state['current_day'] == 1

          section5 = next(x for x in phase0['sections'] if x['section'] == 5)
          assert 'foundation_reconciliation.status' in section5['pass_condition']
          assert 'contradictions' in section5['pass_condition']

          day6 = next(day for day in day_plan['days'] if day['day'] == 6)
          assert day6.get('rendering_enabled') is True
          assert 'CREATIVE_PRODUCTION' in day6['specialists']
          assert budget['image']['model'] == 'gpt-image-2'
          assert budget['video']['model'] == 'gen4.5'
          assert budget['image']['enabled'] is True
          assert budget['video']['enabled'] is True
          assert budget['image']['max_images_per_run'] == 15
          assert budget['video']['max_videos_per_run'] == 5
          assert budget['video']['max_total_seconds_per_run'] <= 25
          assert budget['approval_rules']['synthetic_physical_product_proof'] == 'PROHIBITED'

          section1 = next(x for x in phase0['sections'] if x['section'] == 1)
          assert 'EBOOK_PRODUCTION' in section1['specialists']
          assert Path('gtm/ebook/build_epub.py').exists()
          assert Path('gtm/ebook/README.md').exists()

          # Hardened control-plane invariants.
          assert 'Path(tempfile.gettempdir()) / "finders-book-gtm-runtime"' in control_text
          assert 'approval_class not in {"YELLOW", "RED"}' in control_text
          assert '_authorized_owner(actor)' in control_text
          assert 'output.run_status == "PASS" and not output.pass_condition_met' in control_text
          assert 'output.run_status = "PARTIAL"' in control_text
          assert '"pending_approvals": pending' in control_text
          assert '"PROVIDER_FAILED"' in control_text
          assert 'provider_failures' in control_text
          assert 'rich_execution_context' in control_text
          assert 'latest_120_observations' in control_text
          assert 'guarded_foundation_qa' in control_text
          assert 'foundation_reconciliation' in control_text
          assert 'Day 6 requires exactly' in control_text
          assert 'RUNWAYML_API_SECRET missing for video rendering' in control_text
          assert 'provider is disabled by creative-budget.json' in control_text

          # Trusted workflow + persistence ordering invariants.
          assert 'gtm/autopilot/control_plane.py' in workflow_text
          assert 'ref: main' in workflow_text
          assert 'Runtime archive path validation passed.' in workflow_text
          assert 'AUTOPILOT_MODE' in workflow_text
          assert 'OPENAI_API_KEY is required for autonomous run mode.' in workflow_text
          persist_pos = workflow_text.index('name: Encrypt and persist bounded runtime state')
          upload_pos = workflow_text.index('name: Upload generated creative and ebook artifacts')
          assert persist_pos < upload_pos

          # EPUB validity/identity contracts.
          assert 'def stable_identifier' in epub_text
          assert 'metadata.identifier is required and must remain stable across rebuilds' in epub_text
          assert 'ET.fromstring' in epub_text
          assert 'malformed XHTML' in epub_text

          print('PASS: Phase 0, nine-agent, Day 6 creative, EPUB, persistence, and hardened control-plane contracts validated.')
          PY

      - name: Exercise EPUB validity and stable-identity guardrails
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/valid.json" <<'JSON'
          {
            "metadata": {
              "title": "Finder Test Reading Edition",
              "creator": "Test",
              "language": "en-US",
              "identifier": "urn:uuid:11111111-2222-3333-4444-555555555555"
            },
            "chapters": [{"id":"one","title":"One","body_xhtml":"<p>A &amp; B</p>"}]
          }
          JSON
          python gtm/ebook/build_epub.py --input "$tmpdir/valid.json" --output "$tmpdir/valid.epub"
          test -s "$tmpdir/valid.epub"

          cat > "$tmpdir/malformed.json" <<'JSON'
          {
            "metadata": {
              "title": "Finder Test Reading Edition",
              "creator": "Test",
              "language": "en-US",
              "identifier": "urn:uuid:11111111-2222-3333-4444-555555555555"
            },
            "chapters": [{"id":"one","title":"One","body_xhtml":"<p>A & B</p>"}]
          }
          JSON
          if python gtm/ebook/build_epub.py --input "$tmpdir/malformed.json" --output "$tmpdir/bad.epub"; then
            echo "Malformed XHTML unexpectedly passed."
            exit 1
          fi

          cat > "$tmpdir/no-id.json" <<'JSON'
          {
            "metadata": {"title":"Finder Test Reading Edition","identifier":""},
            "chapters": [{"id":"one","title":"One","paragraphs":["Safe text"]}]
          }
          JSON
          if python gtm/ebook/build_epub.py --input "$tmpdir/no-id.json" --output "$tmpdir/no-id.epub"; then
            echo "Missing stable identifier unexpectedly passed."
            exit 1
          fi
          echo "PASS: EPUB builder rejects malformed XHTML and unstable identity."