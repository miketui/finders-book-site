name: Validate Finder's Book site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project metadata
        run: npm ci --ignore-scripts

      - name: Run repository validation
        run: npm run validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  render:
    name: Rendered-page smoke test
    runs-on: ubuntu-latest
    # Static validation compares MARKUP. It cannot see that an element is
    # present, correct, and invisible. On 2026-08-01 a GSAP rewrite silently
    # left the hero headline, subhead and product image at opacity 0 on
    # about/order/contact with zero console errors and zero 404s. This job
    # renders every page in a real browser and fails the build if
    # above-the-fold content is not actually visible.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve browser for Playwright
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -n "$chrome_path" ]]; then
            echo "PLAYWRIGHT_CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
            "$chrome_path" --version
          else
            echo "No system Chrome found; installing Playwright Chromium."
            npx playwright install --with-deps chromium
          fi

      - name: Render smoke test
        run: npm run test:render
