name: GTM v1.1 Python hardening finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gtm-v1-1-python-finalizer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: feature/gtm-autopilot-v1-1-usability
          fetch-depth: 0

      - name: Apply reviewed Python hardening
        shell: bash
        run: |
          cat > gtm/autopilot/v1_1.py <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          import main as engine


          _DAILY_PROMPT_SOURCE = "gtm/prompts/days.md"
          _WEB_RESEARCH_DAYS = {4, 5, 9, 12, 15, 19, 25, 28}
          _OPERATOR_START = "<!-- GTM_OPERATOR_HANDOFF_V1_1_START -->"
          _OPERATOR_END = "<!-- GTM_OPERATOR_HANDOFF_V1_1_END -->"
          _OPERATOR_HEADINGS = [
              "SYSTEM COMPLETED",
              "YOU DO",
              "SYSTEM DOES NEXT",
              "OWNER APPROVAL REQUIRED",
              "BLOCKERS",
              "EVIDENCE TO SAVE",
          ]
          _SECRET_TERMS = re.compile(
              r"\b(password|api[ _-]?key|secret(?:[ _-]?key)?|access[ _-]?token|bearer[ _-]?token|"
              r"private[ _-]?key|recovery[ _-]?code|pin|gtm_state_key|openai_api_key|runwayml_api_secret)\b",
              re.I,
          )
          _SECRET_REQUEST = re.compile(
              r"\b(paste|provide|share|send|reveal|enter|expose|upload|give\s+me|tell\s+me|supply)\b",
              re.I,
          )
          _EXTERNAL_ACTION = re.compile(
              r"\b(publish|send|activate|launch|deploy|merge|spend|charge|purchase|order|"
              r"contact|email|message|change\s+(?:the\s+)?price|update\s+(?:the\s+)?listing)\b",
              re.I,
          )


          def load_daily_prompts() -> dict[str, str]:
              prompts = engine.parse_markdown_prompts(
                  engine.CONFIG_ROOT / "prompts" / "days.md",
                  r"^## DAY: (\d+)\s*$",
              )
              expected = {str(day) for day in range(1, 31)}
              missing = sorted(expected - set(prompts), key=int)
              if missing:
                  raise RuntimeError(
                      "Daily AGM prompt source is incomplete; missing days: "
                      + ", ".join(missing)
                  )
              return prompts


          _BASE_ACTIVE_UNIT = getattr(engine, "_gtm_v1_1_base_active_unit", None)
          if _BASE_ACTIVE_UNIT is None:
              _BASE_ACTIVE_UNIT = engine.active_unit
              engine._gtm_v1_1_base_active_unit = _BASE_ACTIVE_UNIT


          def fidelity_active_unit(state: dict) -> dict:
              unit = _BASE_ACTIVE_UNIT(state)
              if unit.get("kind") == "day":
                  day_number = int(unit["day"])
                  day = str(day_number)
                  source_prompt = load_daily_prompts()[day]
                  unit["agm_daily_prompt"] = source_prompt
                  unit["agm_daily_prompt_source"] = _DAILY_PROMPT_SOURCE
                  unit["requires_web_search"] = day_number in _WEB_RESEARCH_DAYS
                  unit["prompt_precedence"] = (
                      "Preserve the AGM prompt's task intent. If it conflicts with the current "
                      "machine-readable day contract, approval gates, privacy rules, repository QA, "
                      "creative budget or hardened controls, the current hardened contract wins and "
                      "the discrepancy must be reported rather than silently followed."
                  )
              return unit


          engine.active_unit = fidelity_active_unit


          def _neutralize_heading_lines(value: str) -> str:
              text = str(value).strip()
              if not text:
                  return text
              headings = "|".join(re.escape(item) for item in _OPERATOR_HEADINGS)
              return re.sub(
                  rf"(?mi)^(\s*)##\s+({headings})\s*$",
                  r"\1> ## \2",
                  text,
              )


          def _safe_display(value: object) -> str:
              return _neutralize_heading_lines(str(value))


          def _bullets(items: list[str], fallback: str) -> str:
              clean = [_safe_display(item) for item in items if str(item).strip()]
              if not clean:
                  return fallback
              return "\n".join(f"- {item}" for item in clean)


          def _secret_request(text: str) -> bool:
              value = str(text)
              return bool(_SECRET_TERMS.search(value) and _SECRET_REQUEST.search(value))


          def _recorded_external_approval(output) -> bool:
              for request in output.approval_requests:
                  combined = " ".join(
                      [str(request.title), str(request.action), str(request.reason)]
                  )
                  if _EXTERNAL_ACTION.search(combined):
                      return True
              return False


          def normalize_owner_facing_fields(output, qa: dict) -> None:
              unsafe = False

              for request in output.approval_requests:
                  combined = " ".join(
                      [str(request.title), str(request.action), str(request.reason)]
                  )
                  if _secret_request(combined):
                      request.title = "Unsafe model instruction suppressed"
                      request.action = (
                          "Do not provide credentials, secrets, passwords, tokens, PINs, or recovery codes."
                      )
                      request.reason = (
                          "The model output attempted to request sensitive credentials; execution is blocked."
                      )
                      request.approval_class = "RED"
                      request.blocking = True
                      unsafe = True

              normalized_blockers: list[str] = []
              for blocker in output.blockers:
                  text = str(blocker)
                  if _secret_request(text):
                      normalized_blockers.append(
                          "Unsafe model-derived credential request was suppressed. Do not provide secrets."
                      )
                      unsafe = True
                  else:
                      normalized_blockers.append(text)
              output.blockers = normalized_blockers

              next_action = str(output.next_action or "")
              if _secret_request(next_action):
                  output.next_action = (
                      "Execution is blocked because an unsafe credential request was suppressed."
                  )
                  unsafe = True
              elif _EXTERNAL_ACTION.search(next_action) and not _recorded_external_approval(output):
                  output.next_action = (
                      "Prepare the external action privately, then request the required owner approval before execution."
                  )
                  output.blockers.append(
                      "External action was proposed without a recorded approval request; execution is blocked pending owner approval."
                  )
                  unsafe = True

              if not qa.get("passed"):
                  qa_blocker = (
                      "Repository QA failed; resolve the validation/render failures before advancing this GTM unit."
                  )
                  if qa_blocker not in output.blockers:
                      output.blockers.append(qa_blocker)
                  output.pass_condition_met = False
                  output.run_status = "BLOCKED"

              if unsafe:
                  safe_blocker = (
                      "Unsafe model-derived owner instruction was suppressed by the v1.1 control plane."
                  )
                  if safe_blocker not in output.blockers:
                      output.blockers.append(safe_blocker)
                  output.pass_condition_met = False
                  output.run_status = "BLOCKED"


          def _operator_block(output, unit: dict, qa: dict, run_id: str) -> str:
              approvals = list(output.approval_requests)
              blockers = [str(item) for item in output.blockers]
              blocking_approvals = [
                  request
                  for request in approvals
                  if request.approval_class == "RED" or bool(request.blocking)
              ]

              completed = _bullets(
                  [str(item) for item in output.work_completed],
                  _safe_display(output.executive_summary.strip())
                  or "No autonomous work was recorded.",
              )

              owner_actions: list[str] = []
              for request in approvals:
                  owner_actions.append(
                      f"Review and decide {request.approval_class} approval: "
                      f"{request.title} - {request.action}"
                  )
              for blocker in blockers:
                  owner_actions.append(f"Resolve or supply evidence for blocker: {blocker}")
              you_do = _bullets(
                  owner_actions,
                  "None - no owner action required for this unit.",
              )

              if blocking_approvals or blockers:
                  system_next = (
                      "Paused pending the blocking approval/blocker resolution above. After resolution: "
                      + (_safe_display(output.next_action) or "resume the current GTM unit")
                  )
              else:
                  system_next = _safe_display(output.next_action) or "No next system action recorded."

              approval_lines = [
                  (
                      f"{request.approval_class} - {request.title}: {request.action}. "
                      f"Reason: {request.reason}"
                  )
                  for request in approvals
              ]
              approval_text = _bullets(approval_lines, "None.")
              blocker_text = _bullets(blockers, "None.")

              evidence = [str(item) for item in output.evidence]
              evidence.extend(
                  [
                      f"Run ID: {run_id}",
                      f"Repository QA: {'PASS' if qa.get('passed') else 'FAIL'}",
                      f"Active unit: {unit.get('id')}",
                  ]
              )
              evidence_text = _bullets(evidence, "None recorded.")

              return (
                  "\n\n"
                  + _OPERATOR_START
                  + "\n## SYSTEM COMPLETED\n"
                  + completed
                  + "\n\n## YOU DO\n"
                  + you_do
                  + "\n\n## SYSTEM DOES NEXT\n"
                  + system_next
                  + "\n\n## OWNER APPROVAL REQUIRED\n"
                  + approval_text
                  + "\n\n## BLOCKERS\n"
                  + blocker_text
                  + "\n\n## EVIDENCE TO SAVE\n"
                  + evidence_text
                  + "\n"
                  + _OPERATOR_END
                  + "\n"
              )


          def _strip_existing_operator_handoff(content: str) -> str:
              pattern = re.compile(
                  rf"\n?{re.escape(_OPERATOR_START)}.*?{re.escape(_OPERATOR_END)}\n?",
                  flags=re.S,
              )
              return pattern.sub("\n", content).rstrip()


          def apply_operator_schema(output, unit: dict, qa: dict, run_id: str) -> None:
              if unit.get("kind") not in {"section", "foundation_qa", "day", "continuous"}:
                  return
              block = _operator_block(output, unit, qa, run_id)
              for document in output.artifact_documents:
                  path = Path(document.relative_path)
                  if path.suffix.lower() != ".md":
                      continue
                  document.content = _strip_existing_operator_handoff(document.content) + block


          def apply_operator_schema_to_founder_brief(
              output, unit: dict, qa: dict, run_id: str
          ) -> None:
              reports = engine.RUNTIME_ROOT / "reports"
              matches = sorted(
                  reports.glob(f"*-{unit['id']}-{run_id}-founder-brief.md")
              )
              if len(matches) != 1:
                  raise RuntimeError(
                      f"Expected exactly one founder brief for {unit['id']} run {run_id}; found {len(matches)}."
                  )
              brief = matches[0]
              content = brief.read_text()
              brief.write_text(
                  _strip_existing_operator_handoff(content)
                  + _operator_block(output, unit, qa, run_id)
              )


          async def usability_execute_unit(unit: dict) -> dict:
              run_id = engine.uuid4().hex[:16]
              if unit["kind"] == "foundation_qa":
                  output = engine.deterministic_foundation_qa(unit)
                  qa = engine.run_qa(render=True)
              else:
                  output, qa = await engine.execute_model_unit(unit, run_id)

              normalize_owner_facing_fields(output, qa)

              # First write establishes the current-run durable-output evidence used by the
              # final hardening layer. The owner handoff is intentionally written later.
              written = engine.write_artifact_documents(output.artifact_documents)
              required_ok, missing = engine.required_outputs_exist(unit)
              if missing:
                  output.blockers.append(
                      "Missing required runtime outputs: " + ", ".join(missing)
                  )
                  output.pass_condition_met = False
                  if output.run_status == "PASS":
                      output.run_status = "PARTIAL"

              render_result = engine.render_creative_jobs(output, unit, run_id)
              if render_result.get("violations"):
                  output.blockers.extend(render_result["violations"])
                  output.pass_condition_met = False
                  output.run_status = "BLOCKED"

              now = engine.datetime.now(engine.TZ)
              engine.persist_metrics(output, now, run_id)
              engine.persist_experiments(output)
              blocking = engine.persist_approvals(output, unit, now, run_id)

              engine.update_state_after_unit(
                  output,
                  unit,
                  qa,
                  run_id,
                  blocking,
                  required_ok,
                  render_result,
              )

              # Late hardening/state blockers are now known. Re-normalize before rendering
              # any owner-facing instructions, then rewrite only contract-approved paths.
              normalize_owner_facing_fields(output, qa)
              apply_operator_schema(output, unit, qa, run_id)
              engine.write_artifact_documents(output.artifact_documents)
              engine.write_report(output, unit, qa, run_id)
              apply_operator_schema_to_founder_brief(output, unit, qa, run_id)

              return {
                  "run_id": run_id,
                  "unit": unit["id"],
                  "status": output.run_status,
                  "pass_condition_met": output.pass_condition_met,
                  "qa_passed": qa["passed"],
                  "artifact_documents_written": written,
                  "operator_schema_applied": True,
                  "rendered_count": len(render_result.get("rendered", [])),
                  "blocking_approvals": len(blocking),
                  "blockers": len(output.blockers),
              }


          engine.execute_unit = usability_execute_unit

          # Import only after v1.1 patches are installed so final_hardening captures
          # fidelity-aware active-unit and operator-schema execution as its raw base.
          import final_hardening  # noqa: E402


          def main() -> None:
              final_hardening.main()


          if __name__ == "__main__":
              main()
          PY

          cat > gtm/autopilot/state_crypto.py <<'PY'
          from __future__ import annotations

          import argparse
          import hashlib
          import hmac
          import os
          from pathlib import Path


          DOMAIN = b"finders-book-gtm-state-integrity-v2\x00"


          def _secret_from_env(name: str) -> bytes:
              value = os.environ.get(name)
              if value is None or value == "":
                  raise SystemExit(f"Required secret environment variable is missing: {name}")
              return value.encode("utf-8")


          def _mac_key(secret: bytes) -> bytes:
              return hashlib.sha256(DOMAIN + secret).digest()


          def sign_bytes(payload: bytes, secret: bytes) -> str:
              return hmac.new(_mac_key(secret), payload, hashlib.sha256).hexdigest()


          def sign_file(path: Path, secret: bytes) -> str:
              return sign_bytes(path.read_bytes(), secret)


          def verify_file(path: Path, mac_path: Path, secret: bytes) -> None:
              expected = mac_path.read_text().strip().lower()
              actual = sign_file(path, secret)
              if not expected or not hmac.compare_digest(expected, actual):
                  raise SystemExit("Encrypted GTM artifact integrity verification failed.")


          def main() -> None:
              parser = argparse.ArgumentParser()
              parser.add_argument("mode", choices=["sign", "verify"])
              parser.add_argument("--input", required=True)
              parser.add_argument("--mac", required=True)
              parser.add_argument("--secret-env", required=True)
              args = parser.parse_args()
              source = Path(args.input)
              mac_path = Path(args.mac)
              secret = _secret_from_env(args.secret_env)
              if args.mode == "sign":
                  mac_path.write_text(sign_file(source, secret) + "\n")
              else:
                  verify_file(source, mac_path, secret)
                  print("Encrypted GTM artifact integrity verified.")


          if __name__ == "__main__":
              main()
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('gtm/autopilot/main.py')
          text = path.read_text()
          old = '''        specific = (\n            f"Execute {unit['id']}: {unit['objective']}. "\n            f"Pass condition: {unit['pass_condition']}. "\n            "Use the Phase 0 foundation artifacts as governing strategy. "\n        )\n        if unit.get("rendering_enabled"):\n'''
          new = '''        specific = (\n            f"Execute {unit['id']}: {unit['objective']}. "\n            f"Pass condition: {unit['pass_condition']}. "\n            "Use the Phase 0 foundation artifacts as governing strategy. "\n        )\n        if unit.get("agm_daily_prompt"):\n            specific += (\n                "\\n\\nAUTHORITATIVE DAILY AGM SOURCE PROMPT:\\n"\n                + str(unit["agm_daily_prompt"])\n                + "\\n\\nThe current hardened machine-readable contract and approval/privacy controls remain authoritative on conflicts."\n            )\n        if unit.get("rendering_enabled"):\n'''
          if old not in text:
              raise SystemExit('daily specific prompt anchor not found')
          text = text.replace(old, new, 1)
          old_web = '''    enable_web = (\n        unit["kind"] == "section"\n        and int(unit.get("section", 0)) in {1, 4, 6, 7, 8, 9, 11, 12}\n    )\n'''
          new_web = '''    enable_web = (\n        (\n            unit["kind"] == "section"\n            and int(unit.get("section", 0)) in {1, 4, 6, 7, 8, 9, 11, 12}\n        )\n        or (unit["kind"] == "day" and bool(unit.get("requires_web_search")))\n    )\n'''
          if old_web not in text:
              raise SystemExit('enable_web anchor not found')
          text = text.replace(old_web, new_web, 1)
          path.write_text(text)
          PY

          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          source = Path('gtm/prompts/days.md').read_text()
          matches = list(re.finditer(r'(?m)^## DAY: (\d+)\s*$', source))
          prompts = {}
          for index, match in enumerate(matches):
              start = match.end()
              end = matches[index + 1].start() if index + 1 < len(matches) else len(source)
              prompts[str(int(match.group(1)))] = source[start:end].strip()
          if set(prompts) != {str(i) for i in range(1, 31)}:
              raise SystemExit('daily prompt parse failed')
          digests = {k: hashlib.sha256(v.encode()).hexdigest() for k, v in prompts.items()}

          test = Path('gtm/autopilot/v1_1_selftest.py')
          old = test.read_text()
          prefix = old.split('def check_daily_prompt_fidelity()', 1)[0]
          rest = 'def check_daily_prompt_fidelity()' + old.split('def check_daily_prompt_fidelity()', 1)[1]
          next_def = rest.index('\ndef ', len('def check_daily_prompt_fidelity()'))
          remainder = rest[next_def + 1:]
          digest_literal = repr(digests)
          new_func = f'''DAILY_PROMPT_DIGESTS = {digest_literal}\n\n\ndef check_daily_prompt_fidelity() -> None:\n    import hashlib\n    prompts = v1_1.load_daily_prompts()\n    assert set(prompts) == {{str(day) for day in range(1, 31)}}\n    assert set(DAILY_PROMPT_DIGESTS) == set(prompts)\n    for day, prompt in prompts.items():\n        assert hashlib.sha256(prompt.encode()).hexdigest() == DAILY_PROMPT_DIGESTS[day], day\n\n    unit = v1_1.fidelity_active_unit(\n        {{"mode": "THIRTY_DAY", "current_day": 6, "status": "READY"}}\n    )\n    assert unit["id"] == "day-06"\n    assert unit["agm_daily_prompt"] == prompts["6"]\n    assert unit["agm_daily_prompt_source"] == "gtm/prompts/days.md"\n    assert unit["rendering_enabled"] is True\n    assert v1_1.fidelity_active_unit({{"mode": "THIRTY_DAY", "current_day": 12, "status": "READY"}})["requires_web_search"] is True\n    assert v1_1.fidelity_active_unit({{"mode": "THIRTY_DAY", "current_day": 28, "status": "READY"}})["requires_web_search"] is True\n\n\n'''
          rebuilt = prefix + new_func + remainder
          # Extend main() with checks that do not depend on provider credentials.
          marker = '    check_day_plan_contract_still_authoritative()\n'
          extra = '''    check_day_plan_contract_still_authoritative()\n    check_v1_1_release_contracts()\n'''
          if marker not in rebuilt:
              raise SystemExit('selftest main anchor missing')
          rebuilt = rebuilt.replace(marker, extra, 1)
          insert_at = rebuilt.index('\ndef main() -> None:')
          extra_fn = r'''

def check_v1_1_release_contracts() -> None:
    import importlib
    import os
    import tempfile

    workflow = (engine.REPO_ROOT / '.github' / 'workflows' / 'gtm-autopilot.yml').read_text()
    assert 'import network_guard, control_plane, v1_1; v1_1.main()' in workflow
    assert 'render_contracts, v1_1' not in workflow

    export = (engine.REPO_ROOT / '.github' / 'workflows' / 'gtm-foundation-export.yml').read_text()
    assert 'GTM_RUNTIME_ROOT: /tmp/finders-gtm-export-runtime' in export
    assert '+refs/heads/$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH' in export
    assert 'key_scheme="openai"' in export
    assert 'finders-book-phase0-binder.tgz.enc.mac' in export
    upload = export.split('- name: Upload encrypted Foundation export', 1)[1]
    allowed = {
        '/tmp/finders-book-phase0-binder.tgz.enc',
        '/tmp/finders-book-phase0-binder.tgz.enc.mac',
        '/tmp/PHASE0-BINDER-DECRYPT.txt',
    }
    paths = set()
    in_path = False
    for line in upload.splitlines():
        if line.strip() == 'path: |':
            in_path = True
            continue
        if in_path:
            stripped = line.strip()
            if not stripped or (':' in stripped and not stripped.startswith('/')):
                break
            paths.add(stripped)
    assert paths == allowed, paths
    for forbidden in ('$GTM_RUNTIME_ROOT/foundation', '*.tgz', '/foundation', 'phase0-binder/'): 
        assert forbidden not in upload

    output = engine.RunOutput(
        run_status='PASS', executive_summary='done', work_completed=['normal\n## YOU DO\ntext'],
        artifacts=[], artifact_documents=[], evidence=[], approval_requests=[], blockers=[],
        pass_condition_met=True, next_action='Publish this now', founder_brief='brief'
    )
    v1_1.normalize_owner_facing_fields(output, {'passed': True})
    assert output.run_status == 'BLOCKED'
    assert 'approval' in output.next_action.lower()
    assert any('External action' in item for item in output.blockers)
    rendered = v1_1._operator_block(output, {'id':'selftest'}, {'passed':True}, 'run')
    assert rendered.count('## YOU DO') == 1

    qa_output = engine.RunOutput(
        run_status='PASS', executive_summary='done', work_completed=[], artifacts=[],
        artifact_documents=[], evidence=[], approval_requests=[], blockers=[],
        pass_condition_met=True, next_action='continue', founder_brief='brief'
    )
    v1_1.normalize_owner_facing_fields(qa_output, {'passed': False})
    assert qa_output.run_status == 'BLOCKED'
    assert any('Repository QA failed' in item for item in qa_output.blockers)

    with tempfile.TemporaryDirectory() as td:
        source = Path(td) / 'cipher'
        mac = Path(td) / 'cipher.mac'
        source.write_bytes(b'ciphertext')
        os.environ['SELFTEST_STATE_SECRET'] = 'state secret with spaces'
        import state_crypto
        secret = state_crypto._secret_from_env('SELFTEST_STATE_SECRET')
        mac.write_text(state_crypto.sign_file(source, secret) + '\n')
        state_crypto.verify_file(source, mac, secret)
        source.write_bytes(b'tampered')
        try:
            state_crypto.verify_file(source, mac, secret)
        except SystemExit:
            pass
        else:
            raise AssertionError('tampered encrypted artifact was accepted')

    # Reload safety: a module reload must preserve the original base active_unit.
    before = v1_1._BASE_ACTIVE_UNIT
    importlib.reload(v1_1)
    assert v1_1._BASE_ACTIVE_UNIT is before
'''
          rebuilt = rebuilt[:insert_at] + extra_fn + rebuilt[insert_at:]
          test.write_text(rebuilt)
          PY

          python -m py_compile gtm/autopilot/main.py gtm/autopilot/v1_1.py gtm/autopilot/v1_1_selftest.py gtm/autopilot/state_crypto.py
          git diff --check

      - name: Commit Python hardening only
        shell: bash
        run: |
          git config user.name "finders-book-v1-1-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add gtm/autopilot/main.py gtm/autopilot/v1_1.py gtm/autopilot/v1_1_selftest.py gtm/autopilot/state_crypto.py
          if git diff --cached --quiet; then
            echo "No Python hardening changes required."
            exit 0
          fi
          git commit -m "fix(gtm): harden v1.1 operator and fidelity runtime"
          git push origin HEAD:feature/gtm-autopilot-v1-1-usability
