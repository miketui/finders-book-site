name: Finder's Book GTM Autopilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gtm-autopilot.yml"
      - "gtm/**"
      - ".vercelignore"
      - ".gitignore"
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run, approve, reject, status, ebook-ingest, or ebook-build"
        required: true
        default: "run"
        type: choice
        options: [run, approve, reject, status, ebook-ingest, ebook-build]
      approval_id:
        description: "Required for approve/reject"
        required: false
        type: string
      note:
        description: "Optional owner note"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: finders-book-gtm-autopilot
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[gtm-autopilot-bootstrap]')
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      GTM_STATE_KEY: ${{ secrets.GTM_STATE_KEY }}
      GTM_EBOOK_SOURCE_URL: ${{ secrets.GTM_EBOOK_SOURCE_URL }}
      GTM_EBOOK_SOURCE_SHA256: ${{ secrets.GTM_EBOOK_SOURCE_SHA256 }}
      GTM_EBOOK_SOURCE_BEARER: ${{ secrets.GTM_EBOOK_SOURCE_BEARER }}
      GTM_OWNER_ALLOWLIST: ${{ vars.GTM_OWNER_ALLOWLIST || 'miketui' }}
      STATE_BRANCH: gtm-autopilot-state
      GTM_RUNTIME_ROOT: ${{ github.workspace }}/../finders-gtm-runtime
      AUTOPILOT_MODE: ${{ inputs.mode || 'run' }}
      AUTOPILOT_APPROVAL_ID: ${{ inputs.approval_id || '' }}
      AUTOPILOT_NOTE: ${{ inputs.note || '' }}
      AUTOPILOT_ACTOR: ${{ github.actor }}
      AUTOPILOT_BOOTSTRAP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[gtm-autopilot-bootstrap]') && '1' || '0' }}
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize provider and state secrets
        shell: bash
        run: |
          clean_openai="$(printf '%s' "${OPENAI_API_KEY:-}" | tr -d '[:space:]')"
          if [[ "$AUTOPILOT_MODE" == "run" && -z "$clean_openai" ]]; then
            echo "OPENAI_API_KEY is required for autonomous run mode."
            exit 1
          fi
          if [[ -n "$clean_openai" ]]; then
            echo "::add-mask::$clean_openai"
            printf 'OPENAI_API_KEY=%s\n' "$clean_openai" >> "$GITHUB_ENV"
          fi

          clean_runway="$(printf '%s' "${RUNWAYML_API_SECRET:-}" | tr -d '[:space:]')"
          if [[ -n "$clean_runway" ]]; then
            echo "::add-mask::$clean_runway"
            printf 'RUNWAYML_API_SECRET=%s\n' "$clean_runway" >> "$GITHUB_ENV"
          fi

          if [[ -z "${GTM_STATE_KEY:-}" ]]; then
            echo "GTM_STATE_KEY is required for GTM runtime state operations. Add it as a GitHub Actions repository secret."
            exit 1
          fi
          echo "::add-mask::$GTM_STATE_KEY"
          echo "Provider and state secrets normalized without exposing values."

      - name: Initialize private runtime directory
        shell: bash
        run: |
          rm -rf "$GTM_RUNTIME_ROOT"
          mkdir -p "$GTM_RUNTIME_ROOT"
          cp gtm/state.json "$GTM_RUNTIME_ROOT/state.json"
          cp gtm/metrics.json "$GTM_RUNTIME_ROOT/metrics.json"
          cp gtm/experiments.json "$GTM_RUNTIME_ROOT/experiments.json"
          cp gtm/approvals.json "$GTM_RUNTIME_ROOT/approvals.json"

      - name: Restore encrypted GTM runtime state
        shell: bash
        run: |
          if [[ "$AUTOPILOT_BOOTSTRAP" == "1" ]]; then
            echo "Bootstrap marker detected; starting from checked-in PHASE0 templates."
            exit 0
          fi

          git fetch origin "+refs/heads/$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH" || true
          if ! git cat-file -e "origin/$STATE_BRANCH:gtm/runtime-state.enc" 2>/dev/null; then
            echo "No prior encrypted runtime state; using checked-in templates."
            exit 0
          fi

          git show "origin/$STATE_BRANCH:gtm/runtime-state.enc" > /tmp/gtm-runtime.enc
          key_scheme="openai"
          state_version="1"
          integrity="none"
          if git cat-file -e "origin/$STATE_BRANCH:gtm/runtime-state.meta" 2>/dev/null; then
            git show "origin/$STATE_BRANCH:gtm/runtime-state.meta" > /tmp/gtm-runtime.meta
            read -r state_version key_scheme integrity < <(python - <<'PY'
          import json
          metadata = json.load(open('/tmp/gtm-runtime.meta'))
          print(
              metadata.get('version', 1),
              metadata.get('key_scheme', 'openai'),
              metadata.get('integrity', 'none'),
          )
          PY
          )
          fi

          if [[ "$key_scheme" == "state_key" ]]; then
            state_passphrase="$GTM_STATE_KEY"
          else
            if [[ -z "${OPENAI_API_KEY:-}" ]]; then
              echo "Existing legacy state uses the OpenAI-key encryption scheme; the prior OPENAI_API_KEY is required once to migrate it."
              exit 1
            fi
            state_passphrase="$OPENAI_API_KEY"
          fi
          export state_passphrase

          if git cat-file -e "origin/$STATE_BRANCH:gtm/runtime-state.hmac" 2>/dev/null; then
            git show "origin/$STATE_BRANCH:gtm/runtime-state.hmac" > /tmp/gtm-runtime.hmac
            python gtm/autopilot/state_crypto.py verify \
              --input /tmp/gtm-runtime.enc \
              --hmac /tmp/gtm-runtime.hmac \
              --key-env state_passphrase
          elif [[ "$state_version" -ge 2 || "$integrity" == "hmac-sha256" ]]; then
            echo "Authenticated runtime snapshot is missing its required HMAC."
            exit 1
          else
            echo "Legacy v1 CBC snapshot detected; it will be migrated to authenticated v2 after this successful operation."
          fi

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/gtm-runtime.enc \
            -out /tmp/gtm-runtime.tgz \
            -pass env:state_passphrase

          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          allowed_roots = {
              'state.json', 'metrics.json', 'experiments.json', 'approvals.json',
              'foundation', 'reports', 'ebook', 'creative'
          }
          with tarfile.open('/tmp/gtm-runtime.tgz', 'r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe runtime archive path: {member.name}')
                  if not path.parts or path.parts[0] not in allowed_roots:
                      raise SystemExit(f'Unexpected runtime archive path: {member.name}')
                  if member.issym() or member.islnk() or not (member.isfile() or member.isdir()):
                      raise SystemExit(f'Unsupported runtime archive member: {member.name}')
          print('Runtime archive path validation passed.')
          PY

          tar -xzf /tmp/gtm-runtime.tgz -C "$GTM_RUNTIME_ROOT"
          echo "Encrypted GTM runtime state restored outside the public source tree."

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install site dependencies
        run: npm ci --ignore-scripts

      - name: Resolve browser for Autopilot QA
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -n "$chrome_path" ]]; then
            echo "PLAYWRIGHT_CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
            "$chrome_path" --version
          else
            echo "No system Chrome found; installing Playwright Chromium."
            npx playwright install --with-deps chromium
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked Autopilot dependencies
        run: uv sync --project gtm/autopilot --locked

      - name: Compile hardened Autopilot and EPUB builder
        run: python -m py_compile gtm/autopilot/main.py gtm/autopilot/network_guard.py gtm/autopilot/control_plane.py gtm/autopilot/final_hardening.py gtm/autopilot/render_contracts.py gtm/autopilot/v1_1.py gtm/autopilot/state_crypto.py gtm/ebook/build_epub.py

      - name: Execute hardened Autopilot control plane
        shell: bash
        run: |
          # v1_1 installs source-prompt/operator patches, then delegates execution to final_hardening.main().
          uv run --project gtm/autopilot python -c \
            'import sys; sys.path.insert(0, "gtm/autopilot"); import network_guard, control_plane, v1_1, render_contracts; v1_1.main()' \
            --mode "$AUTOPILOT_MODE" \
            --approval-id "$AUTOPILOT_APPROVAL_ID" \
            --note "$AUTOPILOT_NOTE" \
            --actor "$AUTOPILOT_ACTOR"

      - name: Encrypt and persist bounded runtime state
        if: success()
        shell: bash
        run: |
          mkdir -p "$GTM_RUNTIME_ROOT/reports" "$GTM_RUNTIME_ROOT/foundation" "$GTM_RUNTIME_ROOT/ebook" "$GTM_RUNTIME_ROOT/creative"

          mapfile -t old_reports < <(
            find "$GTM_RUNTIME_ROOT/reports" -maxdepth 1 -type f -printf '%T@ %p\n' \
              | sort -nr | tail -n +121 | cut -d' ' -f2-
          )
          if (( ${#old_reports[@]} > 0 )); then
            rm -f -- "${old_reports[@]}"
          fi

          tar -czf /tmp/gtm-runtime.tgz \
            -C "$GTM_RUNTIME_ROOT" \
            state.json metrics.json experiments.json approvals.json foundation reports ebook creative

          state_passphrase="$GTM_STATE_KEY"
          key_scheme="state_key"
          export state_passphrase

          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in /tmp/gtm-runtime.tgz \
            -out /tmp/gtm-runtime.enc \
            -pass env:state_passphrase

          python gtm/autopilot/state_crypto.py sign \
            --input /tmp/gtm-runtime.enc \
            --hmac /tmp/gtm-runtime.hmac \
            --key-env state_passphrase

          python - "$key_scheme" <<'PY'
          import json
          import sys
          json.dump(
              {
                  "version": 2,
                  "key_scheme": sys.argv[1],
                  "cipher": "aes-256-cbc-pbkdf2",
                  "integrity": "hmac-sha256",
              },
              open("/tmp/gtm-runtime.meta", "w"),
              indent=2,
          )
          PY

          git config user.name "finders-book-gtm-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan gtm-state-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p gtm
          cp /tmp/gtm-runtime.enc gtm/runtime-state.enc
          cp /tmp/gtm-runtime.hmac gtm/runtime-state.hmac
          cp /tmp/gtm-runtime.meta gtm/runtime-state.meta
          git add -f gtm/runtime-state.enc gtm/runtime-state.hmac gtm/runtime-state.meta
          git commit -m "chore(gtm): persist latest encrypted autopilot snapshot"
          git push --force origin "HEAD:$STATE_BRANCH"

      - name: Upload generated creative artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: finders-book-gtm-creative-${{ github.run_id }}
          path: ${{ env.GTM_RUNTIME_ROOT }}/creative
          if-no-files-found: ignore
          retention-days: 30
