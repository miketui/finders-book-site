name: Finder's Book GTM Autopilot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gtm-autopilot.yml"
      - "gtm/**"
      - ".vercelignore"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gtm-autopilot.yml"
      - "gtm/**"
      - ".vercelignore"
      - ".gitignore"
  schedule:
    # 08:00 PDT during the initial 30-day launch window.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run, approve, reject, or status"
        required: true
        default: "run"
        type: choice
        options: [run, approve, reject, status]
      approval_id:
        description: "Required for approve/reject"
        required: false
        type: string
      note:
        description: "Optional owner note"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: finders-book-gtm-autopilot
  cancel-in-progress: false

jobs:
  run:
    # The one-time bootstrap push runs only when the merge commit contains the
    # explicit marker. Normal future pushes do not advance the GTM clock.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[gtm-autopilot-bootstrap]')
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GTM_STATE_KEY: ${{ secrets.GTM_STATE_KEY }}
      STATE_BRANCH: gtm-autopilot-state
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Normalize OpenAI API key secret
        shell: bash
        run: |
          clean_openai_api_key="$(printf '%s' "$OPENAI_API_KEY" | tr -d '[:space:]')"
          if [[ -z "$clean_openai_api_key" ]]; then
            echo "OPENAI_API_KEY is empty after normalization."
            exit 1
          fi
          echo "::add-mask::$clean_openai_api_key"
          printf 'OPENAI_API_KEY=%s\n' "$clean_openai_api_key" >> "$GITHUB_ENV"
          echo "OpenAI API key secret normalized without exposing its value."

      - name: Restore encrypted GTM runtime state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git fetch origin "$STATE_BRANCH" || true
          if git cat-file -e "origin/$STATE_BRANCH:gtm/runtime-state.enc" 2>/dev/null; then
            git show "origin/$STATE_BRANCH:gtm/runtime-state.enc" > /tmp/gtm-runtime.enc
            if [[ -n "${GTM_STATE_KEY:-}" ]]; then
              state_passphrase="$GTM_STATE_KEY"
            else
              state_passphrase="$(printf '%s' "$OPENAI_API_KEY" | sha256sum | cut -d' ' -f1)"
            fi
            export state_passphrase
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in /tmp/gtm-runtime.enc \
              -out /tmp/gtm-runtime.tgz \
              -pass env:state_passphrase
            tar -xzf /tmp/gtm-runtime.tgz -C "$GITHUB_WORKSPACE"
            echo "Encrypted GTM runtime state restored."
          else
            echo "No prior encrypted runtime state; starting from checked-in templates."
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Autopilot dependencies
        run: uv sync --project gtm/autopilot

      - name: Compile Autopilot
        run: python -m py_compile gtm/autopilot/main.py

      - name: Execute Autopilot
        shell: bash
        run: |
          MODE="${{ inputs.mode || 'run' }}"
          APPROVAL_ID="${{ inputs.approval_id || '' }}"
          NOTE="${{ inputs.note || '' }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            MODE="run"
            APPROVAL_ID=""
            NOTE="PR-only dry run; runtime files are discarded after validation."
          fi
          uv run --project gtm/autopilot python gtm/autopilot/main.py \
            --mode "$MODE" \
            --approval-id "$APPROVAL_ID" \
            --note "$NOTE"

      - name: Discard PR dry-run runtime output
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fd gtm/reports
          echo "PR dry run complete; no runtime state persisted."

      - name: Encrypt and persist runtime state on isolated branch
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p gtm/reports
          tar -czf /tmp/gtm-runtime.tgz \
            gtm/state.json \
            gtm/metrics.json \
            gtm/experiments.json \
            gtm/approvals.json \
            gtm/reports

          if [[ -n "${GTM_STATE_KEY:-}" ]]; then
            state_passphrase="$GTM_STATE_KEY"
          else
            state_passphrase="$(printf '%s' "$OPENAI_API_KEY" | sha256sum | cut -d' ' -f1)"
          fi
          export state_passphrase
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in /tmp/gtm-runtime.tgz \
            -out /tmp/gtm-runtime.enc \
            -pass env:state_passphrase

          # Remove plaintext runtime changes before switching branches.
          git reset --hard HEAD
          git clean -fd gtm/reports

          git config user.name "finders-book-gtm-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$STATE_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$STATE_BRANCH"; then
            git switch -C "$STATE_BRANCH" "origin/$STATE_BRANCH"
          else
            git switch -C "$STATE_BRANCH"
          fi

          mkdir -p gtm
          cp /tmp/gtm-runtime.enc gtm/runtime-state.enc
          git add -f gtm/runtime-state.enc
          if git diff --cached --quiet; then
            echo "No encrypted runtime state changes."
            exit 0
          fi
          git commit -m "chore(gtm): persist encrypted autopilot runtime state"
          if git show-ref --verify --quiet "refs/remotes/origin/$STATE_BRANCH"; then
            git push --force-with-lease origin "$STATE_BRANCH"
          else
            git push -u origin "$STATE_BRANCH"
          fi
