name: Finder's Book GTM Autopilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gtm-autopilot.yml"
      - "gtm/**"
      - ".vercelignore"
      - ".gitignore"
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run, approve, reject, status, or ebook-build"
        required: true
        default: "run"
        type: choice
        options: [run, approve, reject, status, ebook-build]
      approval_id:
        description: "Required for approve/reject"
        required: false
        type: string
      note:
        description: "Optional owner note"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: finders-book-gtm-autopilot
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[gtm-autopilot-bootstrap]')
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      GTM_STATE_KEY: ${{ secrets.GTM_STATE_KEY }}
      GTM_OWNER_ALLOWLIST: ${{ vars.GTM_OWNER_ALLOWLIST || 'miketui' }}
      STATE_BRANCH: gtm-autopilot-state
      GTM_RUNTIME_ROOT: ${{ runner.temp }}/finders-gtm-runtime
      AUTOPILOT_MODE: ${{ inputs.mode || 'run' }}
      AUTOPILOT_APPROVAL_ID: ${{ inputs.approval_id || '' }}
      AUTOPILOT_NOTE: ${{ inputs.note || '' }}
      AUTOPILOT_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize provider and state secrets
        shell: bash
        run: |
          clean_openai="$(printf '%s' "${OPENAI_API_KEY:-}" | tr -d '[:space:]')"
          if [[ "$AUTOPILOT_MODE" == "run" && -z "$clean_openai" ]]; then
            echo "OPENAI_API_KEY is required for autonomous run mode."
            exit 1
          fi
          if [[ -n "$clean_openai" ]]; then
            echo "::add-mask::$clean_openai"
            printf 'OPENAI_API_KEY=%s\n' "$clean_openai" >> "$GITHUB_ENV"
          fi

          clean_runway="$(printf '%s' "${RUNWAYML_API_SECRET:-}" | tr -d '[:space:]')"
          if [[ -n "$clean_runway" ]]; then
            echo "::add-mask::$clean_runway"
            printf 'RUNWAYML_API_SECRET=%s\n' "$clean_runway" >> "$GITHUB_ENV"
          fi

          clean_state="$(printf '%s' "${GTM_STATE_KEY:-}" | tr -d '[:space:]')"
          if [[ "$AUTOPILOT_MODE" == "run" && -z "$clean_state" ]]; then
            echo "GTM_STATE_KEY is required before autonomous run mode. Add it as a GitHub Actions repository secret."
            exit 1
          fi
          if [[ -n "$clean_state" ]]; then
            echo "::add-mask::$clean_state"
            printf 'GTM_STATE_KEY=%s\n' "$clean_state" >> "$GITHUB_ENV"
          fi
          echo "Provider and state secrets normalized without exposing values."

      - name: Initialize private runtime directory
        shell: bash
        run: |
          rm -rf "$GTM_RUNTIME_ROOT"
          mkdir -p "$GTM_RUNTIME_ROOT"
          cp gtm/state.json "$GTM_RUNTIME_ROOT/state.json"
          cp gtm/metrics.json "$GTM_RUNTIME_ROOT/metrics.json"
          cp gtm/experiments.json "$GTM_RUNTIME_ROOT/experiments.json"
          cp gtm/approvals.json "$GTM_RUNTIME_ROOT/approvals.json"

      - name: Restore encrypted GTM runtime state
        shell: bash
        run: |
          git fetch origin "$STATE_BRANCH" || true
          if ! git cat-file -e "origin/$STATE_BRANCH:gtm/runtime-state.enc" 2>/dev/null; then
            echo "No prior encrypted runtime state; using checked-in templates."
            exit 0
          fi

          git show "origin/$STATE_BRANCH:gtm/runtime-state.enc" > /tmp/gtm-runtime.enc
          key_scheme="openai"
          if git cat-file -e "origin/$STATE_BRANCH:gtm/runtime-state.meta" 2>/dev/null; then
            git show "origin/$STATE_BRANCH:gtm/runtime-state.meta" > /tmp/gtm-runtime.meta
            key_scheme="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/gtm-runtime.meta')).get('key_scheme', 'openai'))
          PY
          )"
          fi

          if [[ "$key_scheme" == "state_key" ]]; then
            if [[ -z "${GTM_STATE_KEY:-}" ]]; then
              echo "Existing state requires GTM_STATE_KEY but the secret is missing."
              exit 1
            fi
            state_passphrase="$GTM_STATE_KEY"
          else
            if [[ -z "${OPENAI_API_KEY:-}" ]]; then
              echo "Existing legacy state is encrypted with the OpenAI-key scheme; restore requires the prior OPENAI_API_KEY for this one-time migration."
              exit 1
            fi
            state_passphrase="$OPENAI_API_KEY"
          fi
          export state_passphrase

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/gtm-runtime.enc \
            -out /tmp/gtm-runtime.tgz \
            -pass env:state_passphrase

          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          allowed_roots = {
              'state.json', 'metrics.json', 'experiments.json', 'approvals.json',
              'foundation', 'reports', 'ebook'
          }
          with tarfile.open('/tmp/gtm-runtime.tgz', 'r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe runtime archive path: {member.name}')
                  if not path.parts or path.parts[0] not in allowed_roots:
                      raise SystemExit(f'Unexpected runtime archive path: {member.name}')
                  if member.issym() or member.islnk() or not (member.isfile() or member.isdir()):
                      raise SystemExit(f'Unsupported runtime archive member: {member.name}')
          print('Runtime archive path validation passed.')
          PY

          tar -xzf /tmp/gtm-runtime.tgz -C "$GTM_RUNTIME_ROOT"
          echo "Encrypted GTM runtime state restored outside the public source tree."

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install site dependencies
        run: npm ci --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked Autopilot dependencies
        run: uv sync --project gtm/autopilot --locked

      - name: Compile Autopilot, network guard, control plane and EPUB builder
        run: python -m py_compile gtm/autopilot/main.py gtm/autopilot/network_guard.py gtm/autopilot/control_plane.py gtm/ebook/build_epub.py

      - name: Execute hardened Autopilot control plane
        shell: bash
        run: |
          uv run --project gtm/autopilot python -c \
            'import sys; sys.path.insert(0, "gtm/autopilot"); import network_guard, control_plane; control_plane.main()' \
            --mode "$AUTOPILOT_MODE" \
            --approval-id "$AUTOPILOT_APPROVAL_ID" \
            --note "$AUTOPILOT_NOTE" \
            --actor "$AUTOPILOT_ACTOR"

      - name: Encrypt and persist bounded runtime state
        if: success()
        shell: bash
        run: |
          mkdir -p "$GTM_RUNTIME_ROOT/reports" "$GTM_RUNTIME_ROOT/foundation" "$GTM_RUNTIME_ROOT/ebook"

          mapfile -t old_reports < <(
            find "$GTM_RUNTIME_ROOT/reports" -maxdepth 1 -type f -printf '%T@ %p\n' \
              | sort -nr | tail -n +121 | cut -d' ' -f2-
          )
          if (( ${#old_reports[@]} > 0 )); then
            rm -f -- "${old_reports[@]}"
          fi

          tar -czf /tmp/gtm-runtime.tgz \
            --exclude='ebook/*.epub' \
            -C "$GTM_RUNTIME_ROOT" \
            state.json metrics.json experiments.json approvals.json foundation reports ebook

          if [[ -z "${GTM_STATE_KEY:-}" ]]; then
            echo "GTM_STATE_KEY is required for all new runtime snapshots."
            exit 1
          fi
          state_passphrase="$GTM_STATE_KEY"
          key_scheme="state_key"
          export state_passphrase

          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in /tmp/gtm-runtime.tgz \
            -out /tmp/gtm-runtime.enc \
            -pass env:state_passphrase

          python - "$key_scheme" <<'PY'
          import json
          import sys
          json.dump(
              {"version": 1, "key_scheme": sys.argv[1]},
              open("/tmp/gtm-runtime.meta", "w"),
              indent=2,
          )
          PY

          git config user.name "finders-book-gtm-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan gtm-state-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p gtm
          cp /tmp/gtm-runtime.enc gtm/runtime-state.enc
          cp /tmp/gtm-runtime.meta gtm/runtime-state.meta
          git add -f gtm/runtime-state.enc gtm/runtime-state.meta
          git commit -m "chore(gtm): persist latest encrypted autopilot snapshot"
          git push --force origin "HEAD:$STATE_BRANCH"

      - name: Upload generated creative and ebook artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: finders-book-gtm-${{ github.run_id }}
          path: |
            ${{ env.GTM_RUNTIME_ROOT }}/creative
            ${{ env.GTM_RUNTIME_ROOT }}/ebook/*.epub
          if-no-files-found: ignore
          retention-days: 30
